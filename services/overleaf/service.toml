[service]
id = "overleaf"
name = "Overleaf"
# Classification for browse/filter and policy tag-floors; lowercase-kebab, multi OK.
tags = ["app"]

# Overleaf's Git integration. Clone/push over https://git.overleaf.com with HTTP
# basic auth: username "git", a Git authentication token as the password.
# SafeClaw's git-credential helper emits the phantom as the password and the
# broker substitutes at egress.
hosts = ["git.overleaf.com"]
secrets = ["OVERLEAF_GIT_TOKEN"]
# Where a human mints the secret (auxiliary; display-only helper link).
secret_url = "https://www.overleaf.com/user/settings"
