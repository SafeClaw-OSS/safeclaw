# Consent descriptors for the vault's own control-plane acts — the acts.toml
# counterpart of a service.toml `[requests].consent` (same template grammar,
# different authorship domain: services declare what a REQUEST means, this file
# declares what a VAULT OPERATION means).
#
# Contract (docs/CONSENT_TEMPLATES.md):
# - Every approval surface (grant page, CLI prompt, audit row) renders from
#   THIS table interpolated over the SIGNED op's fields only — `{{vars.target}}`
#   and `{{vars.scope.<key>}}`. No surface may show requester-authored prose.
# - P3 rule: an undefined/empty var renders empty; a fact row whose value
#   renders empty (incl. `false`) is omitted. `true` renders as "yes".
# - `explain` / `explain_zh` is THE one consequence sentence the approval
#   card shows (the five-question card, public/mock/approval-card.html): what
#   approving means, nothing else. No product explainers, no second sentence.
# - `tone` ("neutral" | "warn" | "danger") is the consequence tier, styling
#   AND the batch gate. neutral = one-shot or reversible. warn = persistent
#   or irrevocable consequence (amber), still batchable. danger = destruction
#   (red), confirmed alone, never batched (today: vault-delete only).
#   Upward-only for clients: a client's built-in danger floor for an act kind
#   can never be downgraded by this table.
# - Keep in lockstep with `DISPATCHED_CUSTOM_ACTS` (approve.rs) — the
#   `dispatch_and_table_agree` test fails on drift in either direction.

[acts.vault-unlock]
action = "Unlock vault"
action_zh = "解锁 vault"
explain = "For this session, the agent on this device can use this vault's credentials."
explain_zh = "本次会话内，这台设备上的 agent 可以使用这个 vault 的凭证。"
tone = "neutral"

[acts.vault-lock]
action = "Lock vault"
action_zh = "锁定 vault"
explain = "Your agent can no longer use this vault's credentials until you unlock it again."
explain_zh = "在你再次解锁之前，你的 agent 无法再使用这个 vault 的凭证。"
tone = "neutral"

[acts.vault-delete]
action = "Delete vault"
action_zh = "删除 vault"
explain = "This vault and everything in it is permanently deleted on every device; this cannot be undone."
explain_zh = "这个 vault 及其全部内容会在所有设备上永久删除，无法撤销。"
tone = "danger"

[acts.rename-passkey]
action = "Rename a passkey"
action_zh = "重命名 Passkey"
explain = "Only this passkey's display name changes; keys and access stay the same."
explain_zh = "只更改这个 Passkey 的显示名称，密钥与访问权限不变。"
tone = "neutral"
facts = [
  { label = "New name", label_zh = "新名称", value = "{{vars.scope.new_name}}" },
]

[acts.widen-host]
action = "Permanently allow {{vars.scope.host}}"
action_zh = "永久允许 {{vars.scope.host}}"
explain = "{{vars.scope.connection_id}}'s credential can be sent to {{vars.scope.host}} from now on, without asking, until you remove it."
explain_zh = "{{vars.scope.connection_id}} 的凭证今后可发往 {{vars.scope.host}}，不再询问，直到你移除。"
tone = "warn"
facts = [
  { label = "Connection", label_zh = "连接", value = "{{vars.scope.connection_id}}" },
  { label = "Host", label_zh = "主机", value = "{{vars.scope.host}}" },
]

[acts.narrow-host]
action = "Stop allowing {{vars.scope.host}}"
action_zh = "不再允许 {{vars.scope.host}}"
explain = "Brokered requests can no longer send {{vars.scope.connection_id}}'s credential to {{vars.scope.host}}."
explain_zh = "代理请求不能再把 {{vars.scope.connection_id}} 的凭证发往 {{vars.scope.host}}。"
tone = "neutral"
facts = [
  { label = "Connection", label_zh = "连接", value = "{{vars.scope.connection_id}}" },
  { label = "Host", label_zh = "主机", value = "{{vars.scope.host}}" },
]

[acts.service-add]
action = "Install a third-party service"
action_zh = "安装第三方服务"
explain = "SafeClaw does not review third-party services. Connections that use one send credentials to the hosts it lists."
explain_zh = "SafeClaw 不审查第三方服务。使用它的连接会把凭证发往它列出的主机。"
tone = "neutral"
variants = [
  { when = "{{vars.scope.update}}", action = "Update a third-party service", action_zh = "更新第三方服务" },
]
facts = [
  { label = "Services", label_zh = "服务", value = "{{vars.scope.ids}}" },
  { label = "Sends credentials to", label_zh = "凭证发往", value = "{{vars.scope.destinations}}" },
  { label = "Source", label_zh = "来源", value = "{{vars.scope.from}}" },
  { label = "OAuth", label_zh = "OAuth", value = "{{vars.scope.oauth}}" },
  { label = "New destinations", label_zh = "新增目标主机", value = "{{vars.scope.new_destinations}}" },
  { label = "Loosened or removed rules", label_zh = "放宽或删除的规则", value = "{{vars.scope.loosens}}" },
  { label = "Rules applied", label_zh = "生效的规则", value = "{{vars.scope.tightens}}" },
  { label = "Replaces", label_zh = "替换", value = "{{vars.scope.replaces}}" },
  { label = "Removes", label_zh = "移除", value = "{{vars.scope.removes}}" },
  { label = "Definition", label_zh = "定义原文", value = "{{vars.scope.definitions}}", detail = true },
]

[acts.service-rm]
action = "Remove service definitions {{vars.target}}"
action_zh = "移除服务定义 {{vars.target}}"
explain = "These service definitions are removed from your vault, and connections that use them stop working until a definition is added again."
explain_zh = "这些服务定义会从 vault 中移除，使用它们的连接将停止工作，直到重新添加定义。"
tone = "neutral"
facts = [
  { label = "Services", label_zh = "服务", value = "{{vars.scope.ids}}" },
  { label = "Source", label_zh = "来源", value = "{{vars.scope.from}}" },
  { label = "Connections that stop working", label_zh = "将停止工作的连接", value = "{{vars.scope.connections}}" },
]

[acts.secret-rm]
action = "Remove secret {{vars.target}}"
action_zh = "移除密钥 {{vars.target}}"
explain = "This secret's value is deleted from your vault, and connections referencing it stop working until the key is added again."
explain_zh = "该密钥的值会从 vault 中删除，引用它的连接将停止工作，直到重新添加。"
tone = "neutral"

[acts.connection-rm]
action = "Remove connection {{vars.target}}"
action_zh = "移除连接 {{vars.target}}"
explain = "This connection and the secrets it wrote that nothing else uses are removed, and your agent loses this access immediately."
explain_zh = "该连接及其写入且没有其他连接在用的密钥会被移除，你的 agent 立即失去此访问。"
tone = "neutral"
facts = [
  { label = "Secrets kept", label_zh = "保留密钥", value = "{{vars.scope.keep_secrets}}" },
]

[acts.connection-add]
action = "Add connection {{vars.target}}"
action_zh = "添加连接 {{vars.target}}"
explain = "The listed keys are bound to this connection, which sends them only to the hosts shown."
explain_zh = "列出的密钥会绑定到这条连接，它只会把这些密钥发往所示主机。"
tone = "neutral"
facts = [
  { label = "Service", label_zh = "服务", value = "{{vars.scope.service}}" },
  { label = "Sends to", label_zh = "发往", value = "{{vars.scope.destinations}}" },
  { label = "Uses existing secret", label_zh = "使用已有密钥", value = "{{vars.scope.referenced}}" },
  { label = "Stores new value", label_zh = "存入新值", value = "{{vars.scope.written}}" },
  { label = "Overwrites", label_zh = "覆盖", value = "{{vars.scope.overwrites}}" },
  { label = "Replaces existing connection", label_zh = "替换同名连接", value = "{{vars.scope.replaces}}" },
]

[acts.secret-set]
action = "Store secret {{vars.target}}"
action_zh = "保存密钥 {{vars.target}}"
explain = "This secret is stored in your vault, anchored to the host shown for brokered agent use (with no host, your agent cannot use it)."
explain_zh = "该密钥会存入你的 vault，并锚定到所示主机供 agent 经代理使用（未显示主机则 agent 无法使用）。"
tone = "neutral"
facts = [
  { label = "Host", label_zh = "主机", value = "{{vars.scope.hosts}}" },
]
