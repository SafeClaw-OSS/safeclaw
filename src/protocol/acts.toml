# Consent descriptors for the vault's own control-plane acts — the acts.toml
# counterpart of a service.toml `[requests].consent` (same template grammar,
# different authorship domain: services declare what a REQUEST means, this file
# declares what a VAULT OPERATION means).
#
# Contract (docs/CONSENT_TEMPLATES.md):
# - Every approval surface (grant page, CLI prompt, audit row) renders from
#   THIS table interpolated over the SIGNED op's fields only — `{{vars.target}}`
#   and `{{vars.scope.<key>}}`. No surface may show requester-authored prose.
# - P3 rule: an undefined/empty var renders empty; a fact row whose value
#   renders empty (incl. `false`) is omitted. `true` renders as "yes".
# - `tone` is advisory upward-only for clients: a client's built-in danger
#   floor for an act kind can never be downgraded by this table.
# - Keep in lockstep with `DISPATCHED_CUSTOM_ACTS` (approve.rs) — the
#   `dispatch_and_table_agree` test fails on drift in either direction.

[acts.vault-unlock]
action = "Unlock vault"
action_zh = "解锁 vault"
explain = "Brings your vault online so your agent can use its stored credentials this session. No secret leaves SafeClaw."
explain_zh = "让你的 vault 上线，这个会话里你的 agent 就能用里面存的凭证。任何凭证都不会离开 SafeClaw。"
tone = "neutral"

[acts.vault-lock]
action = "Lock vault"
action_zh = "锁定 vault"
explain = "Takes your vault offline. Your agent can no longer use stored credentials until you unlock again."
explain_zh = "让你的 vault 下线。在你再次解锁之前，你的 agent 无法使用存储的凭证。"
tone = "neutral"

[acts.vault-delete]
action = "Delete vault"
action_zh = "删除 vault"
explain = "Permanently erases this vault and everything in it. This cannot be undone. You would have to set it up again from scratch."
explain_zh = "永久抹除此 vault 及其中的一切内容。此操作无法撤销，之后只能从头重新设置。"
tone = "danger"

[acts.rename-passkey]
action = "Rename a passkey"
action_zh = "重命名 Passkey"
explain = "Changes a passkey's display name. Keys and access are unchanged."
explain_zh = "仅更改 Passkey 的显示名称，密钥与访问权限不变。"
tone = "neutral"
facts = [
  { label = "New name", label_zh = "新名称", value = "{{vars.scope.new_name}}" },
]

[acts.widen-host]
action = "Permanently allow {{vars.scope.host}}"
action_zh = "永久允许 {{vars.scope.host}}"
explain = "Adds this host to the connection's allowed destinations forever. Every future brokered request may send its credential here without asking again. Grant only a host you trust."
explain_zh = "将此主机永久添加到该连接的允许目标。今后每个代理请求都可能不再询问就把凭证发送到这里。仅授权你信任的主机。"
tone = "danger"
facts = [
  { label = "Connection", label_zh = "连接", value = "{{vars.scope.connection_id}}" },
  { label = "Host", label_zh = "主机", value = "{{vars.scope.host}}" },
]

[acts.narrow-host]
action = "Stop allowing {{vars.scope.host}}"
action_zh = "不再允许 {{vars.scope.host}}"
explain = "Removes this host from the connection's allowed destinations. Brokered requests can no longer send the credential there. Tightening access is always safe."
explain_zh = "将此主机从该连接的允许目标中移除。此后代理请求不能再把凭证发送到这里。收紧权限始终是安全的。"
tone = "neutral"
facts = [
  { label = "Connection", label_zh = "连接", value = "{{vars.scope.connection_id}}" },
  { label = "Host", label_zh = "主机", value = "{{vars.scope.host}}" },
]

[acts.service-add]
action = "Add service definitions"
action_zh = "添加服务定义"
explain = "Stores these service definitions in your vault. Connections made with them send their credentials and sign-in data only to the hosts listed. The source line says whether it was checked on your device or only stated by the requester. Approve only a source you trust."
explain_zh = "把这些服务定义存入你的 vault。用它们建立的连接只会把凭证和登录数据发往列出的主机。来源一行会说明它是在你的设备上核对过的，还是仅由请求方声称。只批准你信任的来源。"
tone = "danger"
facts = [
  { label = "Source", label_zh = "来源", value = "{{vars.scope.from}}" },
  { label = "Services", label_zh = "服务", value = "{{vars.scope.ids}}" },
  { label = "Sends credentials to", label_zh = "凭证发往", value = "{{vars.scope.destinations}}" },
  { label = "OAuth", label_zh = "OAuth", value = "{{vars.scope.oauth}}" },
  { label = "New destinations", label_zh = "新增目标主机", value = "{{vars.scope.new_destinations}}" },
  { label = "Loosened or removed rules", label_zh = "放宽或删除的规则", value = "{{vars.scope.loosens}}" },
  { label = "Rules applied", label_zh = "生效的规则", value = "{{vars.scope.tightens}}" },
  { label = "Replaces", label_zh = "替换", value = "{{vars.scope.replaces}}" },
  { label = "Removes", label_zh = "移除", value = "{{vars.scope.removes}}" },
]

[acts.service-rm]
action = "Remove service definitions {{vars.target}}"
action_zh = "移除服务定义 {{vars.target}}"
explain = "Deletes these service definitions from your vault. Connections that use them are kept but stop working until a definition is added again."
explain_zh = "从 vault 中删除这些服务定义。使用它们的连接会保留，但在重新添加定义之前无法工作。"
tone = "danger"
facts = [
  { label = "Services", label_zh = "服务", value = "{{vars.scope.ids}}" },
  { label = "Source", label_zh = "来源", value = "{{vars.scope.from}}" },
  { label = "Connections that stop working", label_zh = "将停止工作的连接", value = "{{vars.scope.connections}}" },
]

[acts.secret-rm]
action = "Remove secret {{vars.target}}"
action_zh = "移除密钥 {{vars.target}}"
explain = "Deletes this secret's value from your vault. Connections referencing it stop working until the key is re-added."
explain_zh = "从 vault 中删除该密钥的值。引用它的连接将无法工作，直到重新添加。"
tone = "danger"

[acts.connection-rm]
action = "Remove connection {{vars.target}}"
action_zh = "移除连接 {{vars.target}}"
explain = "Removes this connection and the secrets it wrote that no other connection uses. Secrets that were already in the vault stay. Your agent loses access immediately."
explain_zh = "移除此连接，及它写入且没有其他连接在用的密钥。原本就在 vault 里的密钥会保留。你的 agent 将立即失去访问。"
tone = "danger"
facts = [
  { label = "Secrets kept", label_zh = "保留密钥", value = "{{vars.scope.keep_secrets}}" },
]

[acts.connection-add]
action = "Add connection {{vars.target}}"
action_zh = "添加连接 {{vars.target}}"
explain = "Binds the listed secret key(s) to this connection, which sends them only to the hosts listed. New values are stored in your vault; they never left your device, and this page only checks their fingerprint."
explain_zh = "把列出的密钥绑定到这条连接，它只会把密钥发往列出的主机。新的密钥值存入你的 vault；密钥值从未离开你的设备，本页面只核对它的指纹。"
tone = "neutral"
facts = [
  { label = "Service", label_zh = "服务", value = "{{vars.scope.service}}" },
  { label = "Sends to", label_zh = "发往", value = "{{vars.scope.destinations}}" },
  { label = "Uses existing secret", label_zh = "使用已有密钥", value = "{{vars.scope.referenced}}" },
  { label = "Stores new value", label_zh = "存入新值", value = "{{vars.scope.written}}" },
  { label = "Overwrites", label_zh = "覆盖", value = "{{vars.scope.overwrites}}" },
  { label = "Replaces existing connection", label_zh = "替换同名连接", value = "{{vars.scope.replaces}}" },
]

[acts.secret-set]
action = "Store secret {{vars.target}}"
action_zh = "保存密钥 {{vars.target}}"
explain = "Stores this secret in your vault. If a host is shown above it is anchored there for brokered agent use; with no host, your agent cannot use it. The value never left your device."
explain_zh = "将该密钥存入你的 vault。上方显示主机时会锚定给 agent 经代理使用；未显示主机则 agent 无法使用。密钥值从未离开你的设备。"
tone = "neutral"
facts = [
  { label = "Host", label_zh = "主机", value = "{{vars.scope.hosts}}" },
]
